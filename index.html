<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ нэвтрэх</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page">

<div class="login-card">
  <h2>Админ нэвтрэх</h2>
  <p>Төслүүд болон мэдээг удирдах хэсэг</p>

  <form onsubmit="loginAdmin(event)">
    <input type="text" id="username" placeholder="Нэвтрэх нэр" required>
    <input type="password" id="password" placeholder="Нууц үг" required>
    <button type="submit">Нэвтрэх</button>
  </form>

  <p class="error" id="error"></p>
  <p style="font-size:13px;margin-top:18px;">Username: admin<br>Password: admin123</p>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
